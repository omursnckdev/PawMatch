name: PawMatch
options:
  bundleIdPrefix: com.pawmatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 4.43.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.2.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.11.0
  GeoFireUtils:
    url: https://github.com/firebase/geofire-ios
    from: 1.0.0

targets:
  PawMatch:
    type: application
    platform: iOS
    sources:
      - path: PawMatch
    resources:
      - path: PawMatch/Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawmatch.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ""
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: PawMatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: PawMatch
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "PawMatch uses your location to show you nearby pets and how far away they are."
        NSCameraUsageDescription: "PawMatch uses your camera so you can take photos for your pet's profile."
        NSPhotoLibraryAddUsageDescription: "PawMatch saves photos you choose so they can be added to your pet's profile."
        NSUserTrackingUsageDescription: "PawMatch uses this to show you more relevant ads. You can decline without affecting the rest of the app."
        ITSAppUsesNonExemptEncryption: NO
        CFBundleLocalizations: [en]
        CFBundleDevelopmentRegion: en
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: Kingfisher
        product: Kingfisher
      - package: GeoFireUtils
        product: GeoFireUtils

  PawMatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PawMatchTests
    dependencies:
      - target: PawMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawmatch.app.tests

schemes:
  PawMatch:
    build:
      targets:
        PawMatch: all
        PawMatchTests: [test]
    test:
      targets:
        - PawMatchTests
    run:
      config: Debug
